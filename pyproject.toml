[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandala-computer"
version = "0.1.0"
description = "Python SDK for Mandala Computer — cloud desktops for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mandala", "cloud-desktop", "ai-agents", "computer-use", "vm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# httpx over requests: the SDK needs a sync and an async client from the same
# surface, and agent frameworks are overwhelmingly async. websockets carries
# `mandala ssh`; it is pure Python with no dependencies of its own, which is
# why it rides in the core install instead of an extra nobody would discover.
dependencies = ["httpx>=0.27", "websockets>=13"]

[project.scripts]
mandala = "mandala_computer._cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://mandala.computer"
Source = "https://github.com/mandalacomputer/python-sdk"
Issues = "https://github.com/mandalacomputer/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mandala_computer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `tests` is imported as a package by the async halves, which share fixtures
# and payloads with their sync counterparts rather than restating them. Without
# this, only `python -m pytest` works — it puts the cwd on sys.path, while the
# `pytest` entry point does not, and the suite fails collection outright.
pythonpath = ["."]
