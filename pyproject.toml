[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gorillacloud"
version = "0.0.0"
description = "Python SDK for GorillaCloud — cloud desktops for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["gorillacloud", "cloud-desktop", "ai-agents", "computer-use", "vm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# httpx over requests: the SDK needs a sync and an async client from the same
# surface, and agent frameworks are overwhelmingly async.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://gorillacloud.ai"
Source = "https://github.com/mboyd1/gorillacloud-python"

[tool.hatch.build.targets.wheel]
packages = ["src/gorillacloud"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
