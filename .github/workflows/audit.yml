name: Audit

# pip-audit over what this package lets a user end up with. It ships no
# lockfile, so there are two sets of versions to check: what a fresh install
# of the package and its `anthropic` extra resolves today, and the floors
# pyproject.toml declares, which an existing environment may still hold. The
# floors were where the advisories were: anyio>=3.5 and pydantic>=2 admitted
# versions with published fixes after the MCP server's dependency audit
# prompted a look here (OPL-6036). An advisory is published against code that
# has not changed, so this also runs daily.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package goes into a venv of its own and pip-audit into another,
      # so neither's dependencies are audited as the other's.
      - name: Resolve a fresh install
        run: |
          python -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install --quiet ".[anthropic]"
          "$RUNNER_TEMP/sdk/bin/pip" freeze --exclude mandala-computer > "$RUNNER_TEMP/current.txt"
          python scripts/floor_requirements.py > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
      - name: Install pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet pip-audit==2.10.1
      - name: Audit what a fresh install resolves
        run: '"$RUNNER_TEMP/audit/bin/pip-audit" -r "$RUNNER_TEMP/current.txt" --no-deps --disable-pip --progress-spinner off'
      - name: Audit the declared floors
        if: always()
        run: '"$RUNNER_TEMP/audit/bin/pip-audit" -r "$RUNNER_TEMP/floors.txt" --no-deps --disable-pip --progress-spinner off'
