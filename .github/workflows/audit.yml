name: Audit

# pip-audit over what this package lets a user end up with. It ships no
# lockfile, so two resolutions of the package and its `anthropic` and
# `openai-agents` extras are checked: the newest versions a fresh install picks today, and the declared
# floors (uv's lowest-direct: every direct dependency at its minimum, the rest
# resolved as usual). The floors were where the advisories were: anyio>=3.5
# and pydantic>=2 admitted versions with published fixes (OPL-6036). Each is
# resolved for the oldest and newest Python the package supports, since
# markers can pick different versions.
#
# Not checked: the lowest version of every transitive dependency too. That
# graph does not resolve at all (httpx 0.27 permits idna 0.2, which no longer
# builds), and a transitive's advisory is that project's floor to raise.
#
# Resolution installs nothing, but it is not guaranteed to run no package
# code: uv reads metadata from wheels and from an sdist's static metadata,
# and an sdist without either would be built to get it. --no-build would rule
# that out, but it also moves the floors it cannot honour: on Python 3.14
# pydantic 2.4's core has no wheel, so it resolves 2.12 and the 2.4 floor goes
# unchecked there. The job holds nothing worth taking (contents: read, no
# credentials persisted), so the floors win.
#
# pip-audit runs with --strict: without it a dependency whose lookup fails is
# skipped and the audit still passes.
#
# An advisory is published against code that has not changed, so this also
# runs daily.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet uv==0.9.5 pip-audit==2.10.1
      - name: Resolve
        run: |
          for python in 3.10 3.14; do
            for resolution in highest lowest-direct; do
              out="$RUNNER_TEMP/$resolution-$python.txt"
              "$RUNNER_TEMP/tools/bin/uv" pip compile pyproject.toml --extra anthropic --extra openai-agents \
                --resolution "$resolution" --python-version "$python" \
                --quiet --no-header --no-annotate -o "$out"
              echo "== $resolution, Python $python"; cat "$out"
            done
          done
      - name: Audit
        run: |
          status=0
          for file in "$RUNNER_TEMP"/highest-*.txt "$RUNNER_TEMP"/lowest-direct-*.txt; do
            echo "== $(basename "$file" .txt)"
            "$RUNNER_TEMP/tools/bin/pip-audit" -r "$file" --no-deps --disable-pip --strict --progress-spinner off || status=1
          done
          exit "$status"
