name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types are version-independent: running them once keeps the matrix
  # below about what actually differs between interpreters.
  lint:
    # Hosted runners: with the repository public, minutes are free and the
    # matrix runs genuinely in parallel. A runner of our own on a public repo
    # would execute any fork's pull request on our own machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message half of check_internals needs the base branch to
          # diff against; the default shallow clone has no origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # This repo is public and the platform it speaks to is not. Every batch of
      # client fixes is written by reading that platform, and the reading leaves
      # fingerprints — file names, internal function names — in comments that
      # SHIP. OPL-4613 and OPL-4617 scrubbed two of these repos by hand and left
      # nothing behind to catch the next one; this is that (OPL-4635).
      #
      # Both halves. A commit message is public the moment it is pushed, and
      # three of the five references found in the batch that prompted this were
      # in messages and PR descriptions rather than in files — which the file
      # scan cannot see. Needs the full history, hence fetch-depth above.
      - run: python3 scripts/check_internals.py
      - run: python3 scripts/check_internals.py --messages origin/${{ github.event.pull_request.base.ref || 'main' }}..HEAD
        if: github.event_name == 'pull_request'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject claims (>=3.10); the ceiling is what
        # people are actually on. A claim nobody tests is the same kind of
        # unchecked mirror as the route allowlist.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      # Catches the metadata that only fails at upload time — a malformed
      # README or a URL PyPI will not take.
      - run: twine check dist/*
